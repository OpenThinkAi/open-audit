[package]
name = "open-audit"
version = "0.2.1"
edition = "2024"
description = "CLI for auditing codebases against composable spec docs."
license = "MIT OR Apache-2.0"
repository = "https://github.com/OpenThinkAi/open-audit"

[[bin]]
name = "oaudit"
path = "src/main.rs"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
# Publish jobs to run in CI
publish-jobs = ["npm"]
# Which actions to run on pull requests. "skip": release.yml has no
# pull_request trigger (it runs on push to main only).
pr-run-mode = "skip"
# Build provenance (SLSA) attestations for every release artifact. Attest in
# the `host` job, not in build-local-artifacts, so the OIDC token is never
# exposed to jobs that run crate build scripts.
github-attestations = true
github-attestations-phase = "host"
# Where to host releases
hosting = "github"
# The npm package should have this name
npm-package = "@openthink/audit"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# release.yml is hand-patched (push-to-main trigger + npm version gate,
# least-privilege permissions, lockfile check, OIDC publish-npm). Each patch
# is marked in the workflow. Tell dist not to flag these as drift. See
# RELEASING.md.
allow-dirty = ["ci"]

# Pin every third-party Action dist emits to a full commit SHA. Keep in sync
# with the `uses:` lines in .github/workflows/release.yml.
[workspace.metadata.dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "b7c566a772e6b6bfb58ed0dc250532a479d7789f" # v6.0.0
"actions/download-artifact" = "37930b1c2abaa49bbe596cd826c3c89aef350131" # v7.0.0
"actions/setup-node" = "249970729cb0ef3589644e2896645e5dc5ba9c38" # v6.5.0
"actions/attest-build-provenance" = "96278af6caaf10aea03fd8d33a09a777ca52d62f" # v3.2.0

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# async + process
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "fs", "sync", "time"] }

# error handling
anyhow = "1"
thiserror = "2"

# serde + formats
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
gray_matter = "0.3"

# fs / repo walking
ignore = "0.4"
glob = "0.3"

# git
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
# git2 → libz-sys for compression. Force libz-sys to bundle zlib statically
# so builds don't depend on a system zlib ("unable to find dynamic system
# library 'z'" on minimal runners and cross targets). Slightly larger
# binary; works everywhere.
libz-sys = { version = "1", default-features = false, features = ["static"] }

# misc
tempfile = "3"
console = "0.16"
indicatif = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
